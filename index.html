<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno kettlebell</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2933;--mut:#6b7280;--line:#e2ded5;--acc:#e8590c;--emom:#f9c784;--tab:#f4a6a6;--gym:#a9c8f0;--rest:#e7e7e7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1f242b;--tx:#eceff3;--mut:#9aa4b0;--line:#313944;--acc:#ff8a4c;--emom:#8a5a1c;--tab:#8a3a3a;--gym:#2f5a8f;--rest:#363c45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1f242b;--tx:#eceff3;--mut:#9aa4b0;--line:#313944;--acc:#ff8a4c;--emom:#8a5a1c;--tab:#8a3a3a;--gym:#2f5a8f;--rest:#363c45;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 14px 40px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{flex:1 0 auto;min-width:48px;padding:10px 8px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs small{display:block;font-weight:400;font-size:11px;opacity:.8}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ab{display:flex;gap:8px;margin:10px 0}
.ab button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.ab button.on{border-color:var(--acc);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px}
.ex{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.ex h3{margin:0 0 2px;font-size:16px}
.ex p{margin:0 0 8px;font-size:14px;color:var(--mut)}
.vid{display:inline-block;padding:7px 12px;border-radius:10px;background:var(--acc);color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.msg{text-align:center;padding:26px 10px;color:var(--mut)}
.msg b{display:block;font-size:18px;color:var(--tx);margin-bottom:4px}
.time{font-size:76px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.phase{text-align:center;font-weight:800;letter-spacing:.08em;padding:8px;border-radius:10px;background:var(--rest);color:var(--tx)}
.phase.work{background:var(--acc);color:#fff}.phase.rest{background:var(--gym)}
.tex{text-align:center;font-size:19px;font-weight:700;margin-top:4px}
.tm .mut{text-align:center}
.tm .ab button{padding:14px 6px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;z-index:9}
#flash.on{opacity:.55;transition:none}
</style>
</head>
<body>
<h1>Entreno kettlebell</h1>
<p class="sub" id="sub"></p>
<div class="tabs" id="tabs"></div>
<div id="out"></div>
<div id="flash"></div>
<script>
var EX={
swing2:['Swing a dos manos','Cadera atrás con la espalda recta, balancea la pesa y empuja con la cadera hasta el pecho. Los brazos solo guían.'],
swing1:['Swing a una mano (alternando)','Igual que el swing normal con una sola mano. Cambia de mano a mitad de tiempo.'],
goblet:['Goblet squat','Pesa pegada al pecho, sentadilla profunda con el pecho alto y sube empujando el suelo.'],
cp:['Clean & press (alternando brazos)','Sube la pesa al hombro (posición rack) y empújala sobre la cabeza. Baja controlada y cambia de brazo.'],
row:['Remo inclinado (alternando brazos)','Cadera atrás y espalda plana; lleva la pesa hacia la cadera con el codo pegado.'],
twist:['Russian twist con kettlebell','Sentado con el torso inclinado; gira el tronco de lado a lado tocando el suelo con la pesa.'],
sdhp:['Sumo deadlift high pull','Pies muy abiertos, sube extendiendo cadera y rodillas y tira de la pesa hacia la barbilla con los codos altos.'],
thr:['Thruster con kettlebell','Sentadilla completa con la pesa al pecho y, al subir, empuja la pesa sobre la cabeza en un solo movimiento.'],
rdl:['Peso muerto a una pierna','Pesa en una mano, inclina el torso llevando la otra pierna atrás con la espalda recta. Cambia de pierna.'],
drag:['Plancha con arrastre de kettlebell','En plancha alta, arrastra la pesa de un lado a otro sin girar la cadera.'],
lunge:['Zancada inversa con kettlebell','Pesa al pecho, paso atrás hasta casi tocar el suelo con la rodilla y vuelve. Alterna piernas.']
};
var R={
emom:{A:['swing2','goblet','cp','row','twist'],B:['sdhp','swing1','thr','rdl','drag']},
tabata:{A:['swing2','goblet','thr','row','drag'],B:['sdhp','swing1','cp','lunge','twist']}
};
var DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
var FULL=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
var KIND=['emom','rest','tabata','gym','rest','gym','rest'];
var COL={emom:'var(--emom)',tabata:'var(--tab)',gym:'var(--gym)',rest:'var(--rest)'};
var now=new Date(),dow=(now.getDay()+6)%7;
var mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);
var wk=Math.round((mon-new Date(2026,9,26))/604800000);
var thisAB=(((wk%2)+2)%2===0)?'A':'B';
var sel=dow,ab=thisAB;
document.getElementById('sub').textContent='Esta semana toca la rutina '+thisAB+' · alterna cada semana';
function tabs(){
  var h='';
  for(var i=0;i<7;i++){h+='<button class="'+(i===sel?'on':'')+'" onclick="pick('+i+')">'+DAYS[i]+'<small>'+(i===dow?'hoy':'')+'</small></button>';}
  document.getElementById('tabs').innerHTML=h;
}
function pick(i){sel=i;ab=thisAB;render();}
function setAB(v){ab=v;render();}
function render(){
  tabs();
  var k=KIND[sel],o='';
  var label={emom:'Kettlebell · EMOM',tabata:'Kettlebell · Tabata',gym:'Deka',rest:'Descanso'}[k];
  o+='<div class="card"><span class="badge" style="background:'+COL[k]+'">'+FULL[sel]+'</span><h2 style="margin:10px 0 0;font-size:19px">'+label+'</h2>';
  if(k==='rest'){o+='<div class="msg"><b>Descanso de entreno</b>Solo la caminata de abajo. Hidrátate y estira suave.</div></div>';}
  else if(k==='gym'){o+='<div class="msg"><b>Día de Deka</b>Entrenamiento híbrido. Hoy no toca caminata.</div></div>';}
  else{
    var e=k==='emom';
    o+='<div class="ab"><button class="'+(ab==='A'?'on':'')+'" onclick="setAB(\'A\')">Rutina A</button><button class="'+(ab==='B'?'on':'')+'" onclick="setAB(\'B\')">Rutina B</button></div>';
    o+='<div class="chips">'+(e
      ?'<span>⏱ 40 s trabajo</span><span>😮‍💨 20 s descanso</span><span>🔁 5 rondas de 5 min</span><span>Total ≈ 30 min</span>'
      :'<span>⏱ 20 s trabajo</span><span>😮‍💨 10 s descanso</span><span>🔁 8 rondas por ejercicio</span><span>1 min entre ejercicios</span><span>Total ≈ 30 min</span>')+'</div></div>';
    o+='<div class="card tm"><div class="phase" id="tmPhase">LISTO</div><div class="time" id="tmTime">05:00</div><div class="tex" id="tmEx"></div><div class="mut" id="tmInfo"></div><div class="mut" id="tmLeft"></div><div class="ab"><button id="tmGo" onclick="tmToggle()">▶ Empezar</button><button onclick="tmSkip()">⏭ Saltar</button><button onclick="tmReset()">↺ Reiniciar</button></div><div class="ab"><button onclick="testSound()">🔊 Probar sonido</button></div><div class="mut" style="font-size:12px">Puedes bloquear el móvil: los avisos van dentro del audio. Desde la pantalla de bloqueo: pausa y ⏭ siguiente bloque. En iPhone, quita el modo silencio.</div></div>';
    o+='<div class="card"><p class="sub" style="margin:0 0 4px">'+(e?'Un ejercicio por minuto; al acabar el 5 repite desde el 1. Antes, 5 min de calentamiento.':'Haz las 8 rondas de cada ejercicio y descansa 1 min antes del siguiente. Antes, 5 min de calentamiento.')+'</p>';
    R[k][ab].forEach(function(id,i){
      var x=EX[id];
      o+='<div class="ex"><div class="num">'+(i+1)+'</div><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent('kettlebell '+x[0].replace(/\(.*\)/,'')+' técnica')+'">▶ Ver vídeo</a></div></div>';
    });
    o+='</div>';
  }
  if(k!=='gym'){o+='<div class="card"><span class="badge" style="background:var(--rest)">Todos los días menos Deka</span><h2 style="margin:10px 0 0;font-size:19px">Caminata</h2><p class="sub" style="margin:4px 0 0">Salir a caminar o caminar en la cinta.</p><div class="chips"><span>⛰ Inclinación 15</span><span>⚡ Velocidad 4–5 km/h</span></div></div>';}
  document.getElementById('out').innerHTML=o;
  tmInit(k);
}
// ===== Temporizador basado en una pista de audio: sigue sonando y avanzando con el móvil bloqueado =====
var SR=8000,TM={segs:[],kind:'',ab:'',url:null,total:0,i:-1,iv:null},AU=new Audio(),ART={};
AU.preload='auto';
function $t(i){return document.getElementById(i)}
function tmBuild(){
  var ids=R[TM.kind][TM.ab],nm=ids.map(function(id){return EX[id][0].replace(/\s*\(.*\)/,'')}),sg=[];
  sg.push({t:'warm',d:300,n:'Calentamiento',info:'Movilidad y swings ligeros'});
  if(TM.kind==='emom'){
    for(var r=0;r<5;r++)for(var j=0;j<5;j++){
      sg.push({t:'work',d:40,n:nm[j],info:'Ronda '+(r+1)+'/5 · ejercicio '+(j+1)+'/5'});
      sg.push({t:'rest',d:20,n:'Descanso',info:'Ronda '+(r+1)+'/5 · ejercicio '+(j+1)+'/5'});
    }
  }else{
    for(var j=0;j<5;j++){
      for(var r=0;r<8;r++){
        sg.push({t:'work',d:20,n:nm[j],info:'Ejercicio '+(j+1)+'/5 · ronda '+(r+1)+'/8'});
        sg.push({t:'rest',d:10,n:'Descanso',info:'Ejercicio '+(j+1)+'/5 · ronda '+(r+1)+'/8'});
      }
      if(j<4)sg.push({t:'rest',d:60,n:'Descanso largo',info:'Prepara: '+nm[j+1]});
    }
  }
  var s=0;for(var i=0;i<sg.length;i++){sg[i].s=s;s+=sg[i].d;if(sg[i].t==='rest'&&sg[i].d<60&&sg[i+1])sg[i].info='Siguiente: '+sg[i+1].n}
  TM.segs=sg;TM.total=s;
}
// --- Síntesis de la pista WAV (8 kHz, 8 bits) con todos los avisos ya colocados ---
function tone(buf,at,f,d,v){
  var a=Math.floor(at*SR),n=Math.floor(d*SR),k=2*Math.PI*f/SR;
  for(var i=0;i<n&&a+i<buf.length;i++){
    var env=Math.min(1,i/40,(n-i)/200),x=Math.sin(k*i)+0.35*Math.sin(3*k*i);
    var y=buf[a+i]+x*env*(v||85);buf[a+i]=y>127?127:y<-127?-127:y;
  }
}
function pattern(buf,t,type){
  if(type==='work'){tone(buf,t,1046,.18);tone(buf,t+.22,1318,.18);tone(buf,t+.44,1568,.5)}
  else if(type==='rest'){tone(buf,t,784,.35);tone(buf,t+.4,523,.6)}
  else if(type==='warm'){tone(buf,t,880,.45)}
  else if(type==='end'){tone(buf,t,784,.2);tone(buf,t+.25,1046,.2);tone(buf,t+.5,1318,.2);tone(buf,t+.75,1568,1)}
}
function makeTrack(){
  var dur=TM.total+3,n=Math.ceil(dur*SR),buf=new Float32Array(n);
  TM.segs.forEach(function(sg){
    pattern(buf,sg.s+.05,sg.t);
    for(var c=3;c>=1;c--)if(sg.d>4)tone(buf,sg.s+sg.d-c,880,.12);
  });
  pattern(buf,TM.total+.05,'end');
  var b=new Uint8Array(44+n),dv=new DataView(b.buffer);
  function str(o,s){for(var i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)}
  str(0,'RIFF');dv.setUint32(4,36+n,true);str(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);str(36,'data');dv.setUint32(40,n,true);
  for(var i=0;i<n;i++)b[44+i]=Math.round(buf[i])+128;
  if(TM.url)URL.revokeObjectURL(TM.url);
  TM.url=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
  AU.src=TM.url;AU.load();
}
// --- Carátula para la pantalla de bloqueo ---
function art(type){
  if(ART[type])return ART[type];
  var cfg={work:['#e8590c','TRABAJO'],rest:['#2f6fb5','DESCANSO'],warm:['#d9902a','CALENTAR'],end:['#2e8b57','FIN']}[type];
  var c=document.createElement('canvas');c.width=c.height=512;var x=c.getContext('2d');
  x.fillStyle=cfg[0];x.fillRect(0,0,512,512);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
  x.font='bold '+(cfg[1].length>7?78:96)+'px system-ui,sans-serif';x.fillText(cfg[1],256,256);
  return ART[type]=c.toDataURL('image/png');
}
function segAt(t){var sg=TM.segs;for(var i=sg.length-1;i>=0;i--)if(t>=sg[i].s)return i;return 0}
function meta(i,done){
  if(!('mediaSession' in navigator))return;
  var sg=TM.segs[i],type=done?'end':sg.t;
  var title=done?'¡Terminado!':(sg.t==='work'?'TRABAJO · ':sg.t==='rest'?'DESCANSO · ':'CALENTAMIENTO · ')+sg.n;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:title,artist:done?'Buen trabajo':sg.info,album:'Entreno kettlebell '+TM.kind.toUpperCase()+' '+TM.ab,artwork:[{src:art(type),sizes:'512x512',type:'image/png'}]})}catch(e){}
}
function posState(){
  try{if(navigator.mediaSession&&navigator.mediaSession.setPositionState&&AU.duration)navigator.mediaSession.setPositionState({duration:AU.duration,position:Math.min(AU.currentTime,AU.duration),playbackRate:1})}catch(e){}
}
function sync(){
  if(!TM.segs.length)return;
  var t=AU.currentTime,done=AU.ended||t>=TM.total,i=done?TM.segs.length-1:segAt(t);
  if(i!==TM.i||done!==TM.done){TM.i=i;TM.done=done;meta(i,done);posState()}
  tmDraw();
}
function tmInit(k){
  if(!AU.paused&&TM.segs.length){tmDraw();return} // si está en marcha, no lo cortes al cambiar de día
  if(k==='emom'||k==='tabata'){
    if(TM.kind!==k||TM.ab!==ab||!TM.url){TM.kind=k;TM.ab=ab;tmBuild();TM.url&&URL.revokeObjectURL(TM.url);TM.url=null;AU.removeAttribute('src')}
    TM.i=-1;TM.done=false;tmDraw();
  }
}
function setupSession(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!('mediaSession' in navigator))return;
  var ms=navigator.mediaSession,h=function(a,f){try{ms.setActionHandler(a,f)}catch(e){}};
  h('play',function(){AU.play()});h('pause',function(){AU.pause()});
  h('nexttrack',tmSkip);h('previoustrack',tmPrev);
  h('seekbackward',null);h('seekforward',null);
  h('seekto',function(d){AU.currentTime=d.seekTime;sync()});
}
function tmToggle(){
  if(!TM.segs.length)return;
  if(!TM.url){makeTrack();setupSession()}
  if(TM.done||AU.ended){AU.currentTime=0;TM.done=false}
  if(AU.paused){AU.play().catch(function(){});}else AU.pause();
  sync();
}
function tmSkip(){
  if(!TM.url)return;var i=segAt(AU.currentTime);
  AU.currentTime=i<TM.segs.length-1?TM.segs[i+1].s:TM.total;sync();
}
function tmPrev(){
  if(!TM.url)return;var i=segAt(AU.currentTime),sg=TM.segs[i];
  AU.currentTime=(AU.currentTime-sg.s<3&&i>0)?TM.segs[i-1].s:sg.s;sync();
}
function tmReset(){AU.pause();if(TM.url)AU.currentTime=0;TM.i=-1;TM.done=false;sync();tmDraw()}
function testSound(){
  var n=SR*2,buf=new Float32Array(n);pattern(buf,0,'work');pattern(buf,1.1,'rest');
  var b=new Uint8Array(44+n),dv=new DataView(b.buffer);function str(o,s){for(var i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)}
  str(0,'RIFF');dv.setUint32(4,36+n,true);str(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);str(36,'data');dv.setUint32(40,n,true);
  for(var i=0;i<n;i++)b[44+i]=Math.round(buf[i])+128;
  new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'}))).play().catch(function(){});
}
function fmt(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60);s=s%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function tmDraw(){
  if(!$t('tmTime')||!TM.segs.length)return;
  var t=TM.url?AU.currentTime:0,i=TM.done?TM.segs.length-1:segAt(t),sg=TM.segs[i],started=TM.url&&t>0;
  var p=$t('tmPhase');
  p.className='phase'+(TM.done?'':sg.t==='work'?' work':sg.t==='rest'?' rest':'');
  p.textContent=TM.done?'¡TERMINADO!':!started?'LISTO':sg.t==='warm'?'CALENTAMIENTO':sg.t==='work'?'¡TRABAJO!':'DESCANSO';
  $t('tmTime').textContent=fmt(TM.done?0:sg.s+sg.d-t);
  $t('tmEx').textContent=TM.done?'Buen trabajo 💪':sg.n;
  $t('tmInfo').textContent=TM.done?'':sg.info;
  $t('tmLeft').textContent=TM.done?'':'Quedan '+fmt(TM.total-t)+' en total';
  $t('tmGo').textContent=TM.done?'✅ Otra vez':!AU.paused?'⏸ Pausar':(started?'▶ Reanudar':'▶ Empezar');
}
['timeupdate','play','pause','seeked','ended'].forEach(function(ev){AU.addEventListener(ev,function(){sync();posState()})});
AU.addEventListener('play',function(){if(!TM.iv)TM.iv=setInterval(sync,250);if(navigator.mediaSession)navigator.mediaSession.playbackState='playing'});
AU.addEventListener('pause',function(){clearInterval(TM.iv);TM.iv=null;if(navigator.mediaSession)navigator.mediaSession.playbackState='paused'});
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
render();
</script>
</body>
</html>
